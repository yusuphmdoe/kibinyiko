# .github/workflows/_test.yml
# Reusable workflow: install deps and run npm test.
# Triggered only by workflow_call. Both ci.yml and deploy.yml call this.

name: Test (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version (e.g. `22.22`) to use for tests.
        required: false
        default: '22.22'
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
